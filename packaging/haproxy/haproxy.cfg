global
    log stdout format raw local0
    stats socket /run/haproxy/admin.sock mode 600 level admin
    user haproxy
    group haproxy

defaults
    mode http
    log global
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 5s
    timeout http-keep-alive 5s
