user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The request URI for the log. The value of a `release-preview` parameter is
    # replaced by `REDACTED`, so a preview token never reaches the log. Other
    # requests pass through as they are.
    map $request_uri $dr_log_uri_masked {
        default $request_uri;
        "~^([^?]*\?(?:[^&]*&)*?release-preview)=(?!REDACTED(?:&|$))[^&]*(.*)$" "$1=REDACTED$2";
    }
    # A second parameter with the same name is not masked above. Then the whole
    # query is dropped from the log.
    map $dr_log_uri_masked $dr_log_uri {
        default $dr_log_uri_masked;
        "~^([^?]*)\?(?:.*&)?release-preview=(?!REDACTED(?:&|$))" "$1?REDACTED";
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $dr_log_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'drlog status=$status upstream="$upstream_addr" host="$host" path="$dr_log_uri"';
    access_log /dev/stdout main;

    sendfile on;
    # Send redirects as `/path/`, so the browser keeps the host and port it used.
    absolute_redirect off;
    keepalive_timeout 65;
    # Expire incomplete connections before the supervisor's `30s` stop limit.
    client_header_timeout 10s;

    include /shared/nginx-config/*.conf;
    include /shared/nginx-routes/*.server;
    include /etc/docker-release/nginx/http.d/*.conf;
    include /etc/docker-release/nginx/conf.d/*.conf;
    include /etc/docker-release/proxy/http.d/*.conf;
    include /etc/docker-release/proxy/conf.d/*.conf;

    server {
        listen 80 default_server;
        server_name _;
        # Serve no files, so an unknown host gets 404 and not the stock welcome page.
        root /var/empty/none;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        include /shared/nginx-routes/*.location;
        include /etc/docker-release/nginx/server.d/*.conf;
        include /etc/docker-release/proxy/server.d/*.conf;
    }
}
