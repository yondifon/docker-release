user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    include /shared/nginx-config/*.conf;
    include /shared/nginx-routes/*.server;
    include /etc/docker-release/nginx/http.d/*.conf;
    include /etc/docker-release/nginx/conf.d/*.conf;

    server {
        listen 80 default_server;
        server_name _;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        include /shared/nginx-routes/*.location;
        include /etc/docker-release/nginx/server.d/*.conf;
    }
}
