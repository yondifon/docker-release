user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'drlog status=$status upstream="$upstream_addr" host="$host" path="$request_uri"';
    access_log /dev/stdout main;

    sendfile on;
    # Send redirects as `/path/`, so the browser keeps the host and port it used.
    absolute_redirect off;
    keepalive_timeout 65;
    # Expire incomplete connections before the supervisor's `30s` stop limit.
    client_header_timeout 10s;

    include /shared/nginx-config/*.conf;
    include /shared/nginx-routes/*.server;
    include /etc/docker-release/nginx/http.d/*.conf;
    include /etc/docker-release/nginx/conf.d/*.conf;
    include /etc/docker-release/proxy/http.d/*.conf;
    include /etc/docker-release/proxy/conf.d/*.conf;

    server {
        listen 80 default_server;
        server_name _;
        # Serve no files, so an unknown host gets 404 and not the stock welcome page.
        root /var/empty/none;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        include /shared/nginx-routes/*.location;
        include /etc/docker-release/nginx/server.d/*.conf;
        include /etc/docker-release/proxy/server.d/*.conf;
    }
}
