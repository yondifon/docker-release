# Include extra snippets if you have them
include /etc/nginx/conf.d/custom/*.conf;

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_port $proxy_x_forwarded_port {
    default $http_x_forwarded_port;
    ""      $server_port;
}

server {
    listen 80;

    server_tokens off;

    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;


    # Shared headers for all locations
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline';";
    add_header X-XSS-Protection "1; mode=block";

    if ($request_uri ~* "(\.php|\.asp|\.env|wp-admin|etc/passwd)") {
        return 404;
    }

    # Custom headers
    add_header X-Server-ID $hostname;
    add_header X-Request-ID $request_id;

    userid on;


    location /linear/ {
        proxy_pass http://linear_app_upstream/;
    }

    location /canary/ {
        proxy_pass http://canary_app_upstream/;
    }

    location /bluegreen/ {
        proxy_pass http://blue_green_app_upstream/;
    }
}
