global
    master-worker
    log stdout format raw local0
    stats socket /tmp/haproxy.sock mode 660 level admin expose-fd listeners

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option http-keep-alive
    log global

frontend http
    bind *:80

    acl is_linear    hdr(host),field(1,:) -m str linear.localhost
    acl is_canary    hdr(host),field(1,:) -m str canary.localhost
    acl is_bluegreen hdr(host),field(1,:) -m str bluegreen.localhost

    use_backend linear_app_be     if is_linear
    use_backend canary_app_be     if is_canary
    use_backend blue_green_app_be if is_bluegreen
