services:
  docker-release:
    extends:
      file: ../bundled/docker-compose.yml
      service: docker-release
    build:
      dockerfile: dockerfiles/angie.Dockerfile
    image: docker-release-angie:local
    ports: !override
      - "8090:80"

  linear_app:
    extends:
      file: ../bundled/docker-compose.yml
      service: linear_app

  canary_app:
    extends:
      file: ../bundled/docker-compose.yml
      service: canary_app

  blue_green_app:
    extends:
      file: ../bundled/docker-compose.yml
      service: blue_green_app

  path_app:
    extends:
      file: ../bundled/docker-compose.yml
      service: linear_app
    environment:
      WHOAMI_NAME: path
    labels:
      release.host: ""
      release.path: /path/

volumes:
  docker-release-state:
