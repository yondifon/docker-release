name: beta

# App stack for project "beta". Shares the test-global-web network created by
# ../docker-compose.yml. Start the infra stack first, then bring this up.
#
# Deliberately uses the same service names as project-alpha to verify that
# docker-release keeps them fully isolated ("beta/app" vs "alpha/app"):
#   - separate state files: beta_app_state.json vs alpha_app_state.json
#   - separate deploy locks
#   - separate deployment goroutine slots

networks:
  web:
    external: true
    name: test-global-web

services:
  app:
    image: traefik/whoami
    networks: [web]
    environment:
      - WHOAMI_NAME=beta-app
      - VIRTUAL_HOST=beta.localhost
      - VIRTUAL_PATH=/
      - VIRTUAL_DEST=/
    labels:
      - "release.enable=true"
      - "release.provider=nginx-proxy"
      - "release.strategy=linear"
      - "release.drain_timeout=5s"

  canary_app:
    image: traefik/whoami
    networks: [web]
    environment:
      - WHOAMI_NAME=beta-canary
      - VIRTUAL_HOST=beta.localhost
      - VIRTUAL_PATH=/canary/
      - VIRTUAL_DEST=/
    labels:
      - "release.enable=true"
      - "release.provider=nginx-proxy"
      - "release.strategy=canary"
      - "release.canary.start_percentage=25"
      - "release.canary.step=25"
      - "release.canary.interval=10s"
